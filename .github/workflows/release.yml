# Pushing a vX.Y.Z tag builds the minified release APK and, when the signing secrets are set,
# publishes it as a GitHub Release. Without the secrets the APK is only checked and kept as a
# workflow artifact (signed with the runner's debug key), so the workflow never fails for lack of a key.
# Secrets and key creation: README "Release signing".
name: Release

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing vX.Y.Z tag to (re)build
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
      HAS_KEY: ${{ secrets.GOTGAN_KEYSTORE_BASE64 != '' && secrets.GOTGAN_KEYSTORE_PASSWORD != '' && secrets.GOTGAN_KEY_ALIAS != '' && secrets.GOTGAN_KEY_PASSWORD != '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      # v1.2.3 -> versionName 1.2.3, versionCode 10203 (minor and patch 0-99); codes up to the old fixed 100 are refused.
      - name: Version from tag
        id: version
        run: |
          if [[ ! "$TAG" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "::error::Tag '$TAG' is not vMAJOR.MINOR.PATCH"; exit 1
          fi
          major=${BASH_REMATCH[1]} minor=${BASH_REMATCH[2]} patch=${BASH_REMATCH[3]}
          if (( 10#$minor > 99 || 10#$patch > 99 )); then
            echo "::error::Minor and patch must be 0-99 to keep versionCode increasing"; exit 1
          fi
          code=$(( 10#$major * 10000 + 10#$minor * 100 + 10#$patch ))
          if (( code <= 100 )); then
            echo "::error::versionCode $code would not update builds with the old fixed versionCode 100; use v1.0.1 or later"; exit 1
          fi
          echo "name=${TAG#v}" >> "$GITHUB_OUTPUT"
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "versionName ${TAG#v}, versionCode $code"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Android SDK packages
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;35.0.0" > /dev/null

      - name: Release key
        if: env.HAS_KEY == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.GOTGAN_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          echo "GOTGAN_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: No release key
        if: env.HAS_KEY != 'true'
        run: echo "::warning::Signing secrets are not set; the APK is signed with the runner's debug key and no GitHub Release is published. See README 'Release signing'."

      - name: Unit tests and release APK
        env:
          GOTGAN_KEYSTORE_PASSWORD: ${{ secrets.GOTGAN_KEYSTORE_PASSWORD }}
          GOTGAN_KEY_ALIAS: ${{ secrets.GOTGAN_KEY_ALIAS }}
          GOTGAN_KEY_PASSWORD: ${{ secrets.GOTGAN_KEY_PASSWORD }}
        run: >
          ./gradlew :app:testDebugUnitTest :app:assembleRelease --stacktrace
          -Pgotgan.versionCode=${{ steps.version.outputs.code }}
          -Pgotgan.versionName=${{ steps.version.outputs.name }}

      - name: Check signature and version
        id: apk
        run: |
          apk=app/build/outputs/apk/release/app-release.apk
          build_tools="$ANDROID_HOME/build-tools/35.0.0"
          "$build_tools/apksigner" verify --print-certs "$apk" | tee "$RUNNER_TEMP/certs.txt"
          badging=$("$build_tools/aapt2" dump badging "$apk" | head -1)
          echo "$badging"
          grep -q "versionCode='${{ steps.version.outputs.code }}'" <<< "$badging"
          grep -q "versionName='${{ steps.version.outputs.name }}'" <<< "$badging"
          out="$RUNNER_TEMP/gotgan-${{ steps.version.outputs.name }}.apk"
          cp "$apk" "$out"
          (cd "$RUNNER_TEMP" && sha256sum "$(basename "$out")" > "$(basename "$out").sha256")
          echo "path=$out" >> "$GITHUB_OUTPUT"

      - name: Release APK and R8 mapping
        uses: actions/upload-artifact@v4
        with:
          name: gotgan-${{ steps.version.outputs.name }}
          path: |
            ${{ steps.apk.outputs.path }}
            ${{ steps.apk.outputs.path }}.sha256
            app/build/outputs/mapping/release/mapping.txt
          retention-days: 90

      - name: Publish GitHub Release
        if: env.HAS_KEY == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          files=("${{ steps.apk.outputs.path }}" "${{ steps.apk.outputs.path }}.sha256")
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" "${files[@]}" --clobber
          else
            gh release create "$TAG" "${files[@]}" --verify-tag --title "곳간 ${{ steps.version.outputs.name }}" --generate-notes
          fi
