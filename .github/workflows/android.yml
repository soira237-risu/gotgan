# Unit tests, lint and a debug APK on every push and pull request.
# Device, NAS and release-signing checks stay local (AGENTS.md, docs/PUBLIC-RELEASE.md).
name: Android CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Validates the Gradle wrapper checksum and caches dependencies.
      - uses: gradle/actions/setup-gradle@v4

      - name: Android SDK packages
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;35.0.0" > /dev/null

      # The project key is never committed, so CI signs with the runner's standard debug key and its APK cannot update an installed app.
      - name: Unit tests, lint, debug APK
        run: ./gradlew :app:testDebugUnitTest :app:lintDebug :app:assembleDebug --stacktrace

      # Device tests need a phone or emulator to run, but they must at least keep compiling.
      - name: Device test APK compiles
        run: ./gradlew :app:assembleDebugAndroidTest --stacktrace

      - name: Test and lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            app/build/reports/
            app/build/test-results/
          if-no-files-found: ignore

      - name: Debug APK (CI key)
        uses: actions/upload-artifact@v4
        with:
          name: gotgan-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14

  # A short list of device tests on an emulator; the full suite still needs a real phone.
  device-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Android SDK packages
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;35.0.0" > /dev/null

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Build app and device tests
        run: ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest --stacktrace

      - name: Device tests on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: .github/device-smoke/run.sh

      - name: Device test output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: device-smoke
          path: app/build/device-smoke/
          if-no-files-found: ignore
